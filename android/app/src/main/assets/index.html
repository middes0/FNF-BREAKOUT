<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#080808">
  <title>LOJA 24H</title>
  <link rel="stylesheet" href="game.css">
</head>
<body>
  <div id="game"></div>

  <div id="hud">
    <div class="top">
      <div>
        <strong>LOJA 24H</strong>
        <small>TURNO DA MADRUGADA</small>
      </div>
      <div id="clock">22:00</div>
    </div>
    <div class="task"><span>TAREFA</span><b id="task">Vá até o caixa e ligue o sistema.</b></div>
    <div id="message"></div>
    <div id="prompt"></div>
  </div>

  <div id="crosshair">+</div>

  <div id="mobile">
    <div id="stick"><div id="knob"></div></div>
    <button id="interact">INTERAGIR</button>
    <div id="touchHint">ARRASTE A TELA PARA OLHAR</div>
  </div>

  <div id="start">
    <div class="panel">
      <p>LOJA 24H</p>
      <h1>Turno da madrugada</h1>
      <span>Uma noite normal. Pelo menos no começo.</span>
      <button id="startButton">ENTRAR NO TURNO</button>
      <small>PC: WASD + mouse · Celular: controles na tela</small>
    </div>
  </div>

  <script type="importmap">
  {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}
  </script>
  <script type="module" src="game.js"></script>
</body>
</html>
