name: Build FNF BREAKOUT Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  ENGINE_TAG: "1.2.2"
  HAXE_VER: "4.3.7"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout BREAKOUT
        uses: actions/checkout@v4

      - name: Prepare engine 0.7.3 Mobile
        run: |
          git clone --depth 1 --branch "${ENGINE_TAG}" https://github.com/FunkinPortingMobile/Psych-Engine-0.7.3-Mobile.git engine
          rm -rf engine/example_mods/BREAKOUT
          mkdir -p engine/example_mods/BREAKOUT
          cp -r mod/BREAKOUT/. engine/example_mods/BREAKOUT/
          rm -f engine/example_mods/BREAKOUT/.gitkeep || true
          # Give the build its own package identity and disable desktop-only Discord.
          sed -i 's/com.shadowmario.psychengine073/com.middes.breakout/g' engine/Project.xml
          sed -i 's/PsychMobile0.7.3/MiddesBreakout/g' engine/Project.xml
          sed -i 's/<define name="DISCORD_ALLOWED" unless="ios" \/>/<define name="DISCORD_ALLOWED" if="desktop" \/>/' engine/Project.xml
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("engine/hmm.json")
          data = json.loads(p.read_text())
          data["dependencies"] = [d for d in data["dependencies"] if d.get("name") != "hxdiscord_rpc"]
          p.write_text(json.dumps(data, indent=2) + "\n")
          PY
          test -f engine/Project.xml
          test -f engine/example_mods/BREAKOUT/pack.json

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2.1.0
        with:
          haxe-version: ${{ env.HAXE_VER }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r21e
          link-to-sdk: true

      - name: Prepare Git dependencies
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Install engine libraries exactly as upstream
        working-directory: engine
        run: |
          haxelib setup ~/haxelib
          haxelib install hmm --quiet
          haxelib run hmm setup --quiet
          haxelib run hmm install --quiet
          haxelib run lime rebuild hxcpp --quiet

      - name: Configure Android exactly as upstream
        working-directory: engine
        run: |
          haxelib run lime setup android
          haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_NDK_LATEST_HOME"
          haxelib run lime config JAVA_HOME "$JAVA_HOME_17_X64"
          haxelib run lime config ANDROID_SETUP true

      - name: Verify mod was bundled
        working-directory: engine
        run: |
          test -f example_mods/BREAKOUT/pack.json
          echo "BREAKOUT bundled successfully"
          echo "Haxe: $(haxe --version)"
          haxelib list

      - name: Build APK
        working-directory: engine
        run: haxelib run lime build android -release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FNF-BREAKOUT-Android
          path: engine/export/release/android/bin/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
